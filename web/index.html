    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var p = params.get("p");
          if (!p) return;

          var target = decodeURIComponent(p);
          if (!target.startsWith("/")) {
            target = "/" + target;
          }

          if (window.location.pathname + window.location.search + window.location.hash !== target) {
            window.history.replaceState(null, "", target);
          }
        } catch (e) {}
      })();
    </script>

    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") {
            t =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>

    <style>
      /* The homepage prerender is crawlable/no-JS content, but its editorial
         layout does not match the cinematic React hero. Hide that handoff only
         when JavaScript is active so it cannot flash before the real UI mounts. */
      html.home-app-booting #root { opacity: 0; }
    </style>
    <script>
      (function () {
        if (window.location.pathname !== "/") return;
        document.documentElement.classList.add("home-app-booting");
        window.setTimeout(function () {
          document.documentElement.classList.remove("home-app-booting");
        }, 4000);
      })();
    </script>

  </head>
  <body>
    <div id="root"></div>
