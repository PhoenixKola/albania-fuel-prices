name: Verify live site is fresh

# Deployment integrity is checked against the accepted repo snapshot and the
# deployed build commit. Source publication age is reported independently.
on:
  schedule:
    - cron: "45 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main and history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check deployment integrity and source age
        run: node .github/scripts/verify-live.mjs
