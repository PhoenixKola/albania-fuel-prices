name: Update fuel data (Europe)

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ingest deps
        working-directory: ingest
        run: npm ci

      - name: Run ingest
        working-directory: ingest
        run: npm run run

      - name: Commit changes (if any)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json data/trends.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update fuel data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Rebuild and redeploy so the prerendered HTML carries today's prices.
  # This must be an explicit call: the push above uses GITHUB_TOKEN, and pushes
  # made with that token deliberately do not trigger other workflows.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-web.yml
    secrets: inherit