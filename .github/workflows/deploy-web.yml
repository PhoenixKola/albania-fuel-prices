name: Deploy web

# The Cloudflare Pages project "karburanti-sot" is a Direct Upload project:
# Cloudflare does not build anything itself and does not watch the repo, which
# is why the site sat frozen on 6 July data for a month while the daily price
# commits kept landing. So we build here and upload the result.
#
# Runs on: code/data pushes to main, after the daily data update (called by
# update-data.yml), and manually.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN  — token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID — account ID from the Cloudflare dashboard URL

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/**"
      - ".github/workflows/deploy-web.yml"
  workflow_call:
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # update-data.yml commits today's prices and then calls this
          # workflow. Without an explicit ref, checkout uses the SHA that
          # triggered the run — the commit *before* the data landed — so the
          # daily deploy would rebuild yesterday's prices every single day.
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # Regenerates the analysis from data/history.json, then builds and
      # prerenders. This is what bakes today's prices into the static HTML.
      - name: Build site
        working-directory: web
        run: npm run build

      # Guards against silently shipping an old build: if the HTML we are about
      # to upload does not carry the same date as the data in the repo, the
      # checkout or the generate step went wrong and we want to know loudly.
      - name: Verify build matches repo data
        run: |
          set -euo pipefail
          REPO_AS_OF=$(python3 -c "import json;print(json.load(open('data/latest.json'))['as_of'])")
          BUILT_AS_OF=$(grep -o '<meta name="data-as-of" content="[^"]*"' web/dist/index.html | sed 's/.*content="//; s/"//')
          echo "repo data as_of : $REPO_AS_OF"
          echo "built HTML as_of: $BUILT_AS_OF"
          echo "pages           : $(find web/dist -name '*.html' | wc -l)"
          if [ "$REPO_AS_OF" != "$BUILT_AS_OF" ]; then
            echo "::error::Built HTML carries $BUILT_AS_OF but the repo has $REPO_AS_OF. Refusing to deploy a stale build."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist --project-name=karburanti-sot --branch=main
