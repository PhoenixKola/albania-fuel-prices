name: Deploy web

# The Cloudflare Pages project "karburanti-sot" is a Direct Upload project:
# Cloudflare does not build anything itself and does not watch the repo, which
# is why the site sat frozen on 6 July data for a month while the daily price
# commits kept landing. So we build here and upload the result.
#
# Runs on: code/data pushes to main, after the daily data update (called by
# update-data.yml), and manually.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN  — token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID — account ID from the Cloudflare dashboard URL

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/**"
      - ".github/workflows/deploy-web.yml"
  workflow_call:
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # Regenerates the analysis from data/history.json, then builds and
      # prerenders. This is what bakes today's prices into the static HTML.
      - name: Build site
        working-directory: web
        run: npm run build

      - name: Show what is being deployed
        working-directory: web
        run: |
          echo "Data baked into the build:"
          grep -o '<meta name="data-as-of" content="[^"]*"' dist/index.html || echo "  (marker missing!)"
          echo "Pages: $(find dist -name '*.html' | wc -l)"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist --project-name=karburanti-sot --branch=main
